<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bomberman Live</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/grid.css">
    <link rel="stylesheet" href="./css/player.css">
    <link rel="stylesheet" href="./css/scoreboard.css">
</head>
<body>
    <div id="app">
        <div id="menue-screen" class="screen">
            <h1>Bomberman Live</h1>
            <div class="menue-section">
                <label for="player-name">Player Name</label>
                <input type="text" id="player-name" placeholder="Enter your name" required minlength="2" maxlength="15">
            </div>
            <div class="menue-section">
                <label for="mode">Game Mode</label>
                <select id="mode">
                    <option value="single">Single Player</option>
                    <option value="multi" selected>Multi Player</option>
                </select>
            </div>
            <div id="difficulty-section" class="menue-section hidden">
                <label for="difficulty">Difficulty</label>
                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
            <button id="start-button" disabled>Start Game</button>
        </div>

        <div id="game-screen" class="screen hidden">
            <div id="game-wrapper">
                <div id="grid"></div>

                <div id="hud">
                    <div id="timer">00:00</div>
                    <div id="scoreboard"></div>
                </div>
            </div>
        </div>

        <div id="pause-overlay" class="hidden overlay">
            <h2 id="pause-message">Paused</h2>
            <button id="resume-id">Resume</button>
            <button id="quit-button">Quit</button>
        </div>

        <div id="end-screen" class="screen hidden">
            <h2 id="winner-text"></h2>
            <button id="restart-button">Play Again</button>
        </div>
        
    </div>
    <script src="./public/js/grid.js" type="module" defer></script>
    <script src="./public/js/player.js" type="module" defer></script>
    <script src="./public/js/controls.js" type="module" defer></script>
    <script src="./public/js/renderPlayer.js" type="module" defer></script>
    <script src="./public/js/main.js" type="module" defer></script>
</body>
</html>
